<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#116b4a">
  <title>SellerMate — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f9f7;color:#203129;font-family:system-ui,sans-serif;text-align:center}
    main{max-width:360px;background:white;border:1px solid #e8eee9;border-radius:20px;padding:28px;box-shadow:0 12px 40px #173b2810}
    .mark{width:58px;height:58px;margin:0 auto 18px;border-radius:17px;background:#116b4a;color:white;display:grid;place-items:center;font-size:30px;font-weight:800}
    h1{font-size:22px;margin:0 0 10px}p{color:#718078;line-height:1.7;font-size:14px}
    button{border:0;border-radius:10px;background:#16865c;color:white;padding:12px 18px;font-weight:700}
  </style>
</head>
<body><main><div class="mark">S</div><h1>ইন্টারনেট সংযোগ নেই</h1><p>SellerMate ব্যবহার করতে আবার ইন্টারনেটে যুক্ত হয়ে পেজটি রিফ্রেশ করুন। আগে খোলা অ্যাপের কিছু অংশ সাময়িকভাবে পাওয়া যেতে পারে।</p><button onclick="location.reload()">আবার চেষ্টা করুন</button></main></body>
</html>
